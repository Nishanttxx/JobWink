<!DOCTYPE html>
<html>
<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="JobWink - Build a Job Winning Resume with AI">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JobWink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="shortcut icon" href="favicon.ico"/>

  <!-- Google Fonts Preconnect for CanvasKit & Fallback Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Modern JavaScript Polyfills for PDF.js & Web Rendering Compatibility -->
  <script>
    if (typeof Map !== 'undefined') {
      if (!Map.prototype.getOrInsertComputed) {
        Map.prototype.getOrInsertComputed = function (key, callback) {
          if (this.has(key)) {
            return this.get(key);
          }
          var value = callback(key);
          this.set(key, value);
          return value;
        };
      }
      if (!Map.prototype.getOrInsert) {
        Map.prototype.getOrInsert = function (key, defaultValue) {
          if (this.has(key)) {
            return this.get(key);
          }
          this.set(key, defaultValue);
          return defaultValue;
        };
      }
    }
    if (typeof WeakMap !== 'undefined') {
      if (!WeakMap.prototype.getOrInsertComputed) {
        WeakMap.prototype.getOrInsertComputed = function (key, callback) {
          if (this.has(key)) {
            return this.get(key);
          }
          var value = callback(key);
          this.set(key, value);
          return value;
        };
      }
      if (!WeakMap.prototype.getOrInsert) {
        WeakMap.prototype.getOrInsert = function (key, defaultValue) {
          if (this.has(key)) {
            return this.get(key);
          }
          this.set(key, defaultValue);
          return defaultValue;
        };
      }
    }
    if (typeof Promise !== 'undefined' && !Promise.withResolvers) {
      Promise.withResolvers = function () {
        var resolve, reject;
        var promise = new Promise(function (res, rej) {
          resolve = res;
          reject = rej;
        });
        return { promise: promise, resolve: resolve, reject: reject };
      };
    }
  </script>

  <!-- Mobile Viewport & Root Lock Styles -->
  <style>
    /* Ensure HTML/Body and Flutter views are locked to viewport to prevent browser-level scrolling when virtual keyboard opens */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-y;
      background-color: #060709;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    flutter-view, flt-glass-pane {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
    }

    /* Design Tokens for Radii & Consistency */
    :root {
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    /* Issue 2: Fix microcopy & automation descriptions to standard readable scale (min 13-14px) */
    .styles-module__automationDescription___vFTmJ,
    [class*="automationDescription"],
    [class*="styles-module__description"] {
      font-size: 13px !important;
      line-height: 1.5 !important;
      color: #94a3b8 !important;
    }
    .styles-module__automationDescription___vFTmJ a,
    [class*="automationDescription"] a {
      font-size: 13px !important;
      color: #f97316 !important;
      text-decoration: underline !important;
      text-underline-offset: 2px !important;
    }

    /* Issue 5 & 6: Clean floating developer toolbar with proper safe-area clearance (24px) */
    #agentation-mount {
      position: fixed !important;
      bottom: 24px !important;
      right: 24px !important;
      top: auto !important;
      left: auto !important;
      z-index: 999999 !important;
      pointer-events: none !important;
    }
    #agentation-mount > * {
      pointer-events: auto !important;
    }
    .styles-module__toolbarContainer___dIhma,
    [class*="toolbarContainer"] {
      margin: 0 !important;
      border-radius: var(--radius-lg, 14px) !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3) !important;
    }

    /* Issue 7: Enlarge small tightly packed control buttons for accessible hit targets (36px x 36px) */
    .styles-module__controlButton___8Q0jc,
    [class*="controlButton"] {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      min-height: 36px !important;
      margin: 0 4px !important;
      padding: 6px !important;
      border-radius: var(--radius-md, 10px) !important;
      transition: background-color 150ms ease, transform 150ms ease !important;
    }
    .styles-module__controlButton___8Q0jc:hover,
    [class*="controlButton"]:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
    }

    /* Issue 8: Formatting toolbar & color swatch options with proper sizing & gutters */
    .styles-module__colorOption___Co955,
    [class*="colorOption"] {
      width: 26px !important;
      height: 26px !important;
      min-width: 26px !important;
      min-height: 26px !important;
      margin: 0 4px !important;
      border-radius: 50% !important;
      border: 2px solid transparent !important;
      cursor: pointer !important;
      transition: transform 150ms ease, box-shadow 150ms ease !important;
    }
    .styles-module__colorOption___Co955:hover,
    [class*="colorOption"]:hover {
      transform: scale(1.15) !important;
    }

    /* Issue 9 & 11: Deduplicate redundant MCP & Webhooks navigation links and suppress ghost elements */
    .styles-module__settingsNavLink___uYIwM ~ .styles-module__settingsNavLink___uYIwM,
    [class*="settingsNavLink"] ~ [class*="settingsNavLink"],
    .styles-module__settingsBackButton___fflll:empty,
    .styles-module__settingsBackButton___fflll[aria-hidden="true"] {
      display: none !important;
    }

    /* Issue 10: Provide clear interactive affordance for Standard cycle button */
    .styles-module__cycleButton___XMBx3,
    [class*="cycleButton"] {
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      padding: 4px 10px !important;
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      border-radius: var(--radius-sm, 6px) !important;
      color: #e2e8f0 !important;
      cursor: pointer !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      transition: background-color 150ms ease, border-color 150ms ease !important;
    }
    .styles-module__cycleButton___XMBx3:hover,
    [class*="cycleButton"]:hover {
      background: rgba(255, 255, 255, 0.14) !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
    }
    .styles-module__cycleButton___XMBx3:focus-visible,
    [class*="cycleButton"]:focus-visible {
      outline: 2px solid #f95716 !important;
      outline-offset: 2px !important;
    }

    /* Contain technical settings panels */
    [class*="styles-module__panel"],
    [class*="styles-module__settingsNav"],
    [class*="styles-module__dialog"] {
      max-width: 380px !important;
      border-radius: var(--radius-lg, 14px) !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3) !important;
      backdrop-filter: blur(12px) !important;
    }
  </style>

  <script>
    // Prevent document window scroll displacement when mobile keyboard opens
    function resetWindowScroll() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
      if (document.documentElement && document.documentElement.scrollTop !== 0) {
        document.documentElement.scrollTop = 0;
      }
      if (document.body && document.body.scrollTop !== 0) {
        document.body.scrollTop = 0;
      }
    }

    window.addEventListener('scroll', resetWindowScroll, { passive: true });
    window.addEventListener('resize', resetWindowScroll, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resetWindowScroll, { passive: true });
      window.visualViewport.addEventListener('scroll', resetWindowScroll, { passive: true });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Agentation: localhost-only design feedback toolbar -->
  <script type="module">
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      try {
        const [{ default: React }, { createRoot }, { Agentation }] = await Promise.all([
          import('https://esm.sh/react@18.3.1'),
          import('https://esm.sh/react-dom@18.3.1/client'),
          import('https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1'),
        ]);
        const mount = document.createElement('div');
        mount.id = 'agentation-mount';
        mount.style.position = 'fixed';
        mount.style.zIndex = '999999';
        document.body.appendChild(mount);
        createRoot(mount).render(React.createElement(Agentation, {
          endpoint: "http://localhost:4747",
          onSessionCreated: (sessionId) => {
            console.log("Session started:", sessionId);
          }
        }));
      } catch (e) {
        console.warn('Agentation load failed:', e);
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
