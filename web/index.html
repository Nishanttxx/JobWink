<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jobwink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preconnect for CanvasKit & Fallback Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Three.js & Vanta.js Fog Animated Background Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>

  <!-- GSAP & ScrollTrigger Animation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll Engine -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
    // Vanta.js Hero Background Initializer
    window.initVantaHero = function(targetEl) {
      if (!targetEl) return;

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) return;

      if (typeof THREE === 'undefined' || typeof VANTA === 'undefined' || !VANTA.FOG) {
        console.warn('Vanta.js or Three.js CDN not ready yet');
        return;
      }

      if (window._vantaHeroInstance) {
        try { window._vantaHeroInstance.destroy(); } catch (e) {}
      }

      try {
        window._vantaHeroInstance = VANTA.FOG({
          el: targetEl,
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.00,
          minWidth: 200.00,
          highlightColor: 0x2d1a14, // Subtle warm orange glow matching Jobwink (#2D1A14)
          midtoneColor: 0x12151e,   // Deep slate blue/gray (#12151E)
          lowlightColor: 0x0a0b0f,  // Obsidian base (#0A0B0F)
          baseColor: 0x060709,      // Deep dark background
          blurFactor: 0.70,         // High diffusion = smooth minimal visual noise
          speed: 0.5,               // Slow, elegant ambient movement
          zoom: 1.05
        });

        // Tab visibility handler for Vanta background
        document.addEventListener('visibilitychange', () => {
          // Browser automatically throttles requestAnimationFrame when tab is hidden
        });
      } catch (err) {
        console.warn('Vanta initialization error:', err);
      }
    };

    // Auto-bind Vanta when element is injected into DOM by Flutter
    if (typeof MutationObserver !== 'undefined') {
      const observer = new MutationObserver(() => {
        const heroEl = document.getElementById('vanta-hero-canvas');
        if (heroEl && !heroEl.dataset.vantaInit) {
          heroEl.dataset.vantaInit = 'true';
          window.initVantaHero(heroEl);
        }
      });
      observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Respect prefers-reduced-motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

      if (!prefersReducedMotion && typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // Lenis exponential decay
          orientation: 'vertical',
          gestureOrientation: 'vertical',
          smoothWheel: !isMobile, // Disable on mobile if performance/native feel preferred
          wheelMultiplier: 1.0,
          touchMultiplier: 1.5,
          infinite: false,
        });

        window.lenis = lenis;

        // Sync Lenis scroll ticker with GSAP ScrollTrigger cleanly (single RAF loop)
        if (typeof ScrollTrigger !== 'undefined' && typeof gsap !== 'undefined') {
          lenis.on('scroll', ScrollTrigger.update);
          gsap.ticker.add((time) => {
            lenis.raf(time * 1000);
          });
          gsap.ticker.lagSmoothing(0);
        } else {
          function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
          }
          requestAnimationFrame(raf);
        }
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Agentation: localhost-only design feedback toolbar -->
  <script type="module">
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      try {
        const [{ default: React }, { createRoot }, { Agentation }] = await Promise.all([
          import('https://esm.sh/react@18.3.1'),
          import('https://esm.sh/react-dom@18.3.1/client'),
          import('https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1'),
        ]);
        const mount = document.createElement('div');
        mount.id = 'agentation-mount';
        mount.style.position = 'fixed';
        mount.style.zIndex = '999999';
        document.body.appendChild(mount);
        createRoot(mount).render(React.createElement(Agentation, {
          endpoint: "http://localhost:4747",
          onSessionCreated: (sessionId) => {
            console.log("Session started:", sessionId);
          }
        }));
      } catch (e) {
        console.warn('Agentation load failed:', e);
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
