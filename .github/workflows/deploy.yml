name: Deploy Flutter Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart SDK Versions
        run: |
          echo "Flutter executable path:"
          which flutter
          echo "Dart executable path:"
          which dart
          echo "Flutter version details:"
          flutter --version
          echo "Dart version details:"
          dart --version

      - name: Clean & Resolve Dependencies
        run: |
          flutter clean
          flutter pub get
          flutter analyze

      - name: Build Web Release
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          python3 -c "
          import os, json
          try:
              secrets = json.loads(os.environ.get('SECRETS_JSON', '{}'))
          except Exception:
              secrets = {}
          keys = ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'GEMINI_API_KEY', 'OPENAI_API_KEY', 'BACKEND_URL', 'ADMIN_EMAIL']
          data = {}
          for k in keys:
              val = secrets.get(k) or os.environ.get(k)
              if val:
                  data[k] = val
          with open('dart_defines.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          flutter build web --release --dart-define-from-file=dart_defines.json
          rm -f dart_defines.json


      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
